name: build-windows

on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Also attach the installer to a draft GitHub release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-nsis:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Read release version
        id: release_version
        shell: bash
        run: |
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('apps/desktop/package.json', 'utf8')).version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare Windows CLI sidecar
        run: node scripts/prepare-windows-cli.mjs x86_64-pc-windows-msvc

      - name: Build NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --dir apps/desktop tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TdPrint-${{ steps.release_version.outputs.version }}-windows-x64
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sig
          if-no-files-found: error
          retention-days: 30

      - name: Attach to draft release
        if: ${{ inputs.upload_release }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          TAG="tdprint-v${VERSION}"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "TdPrint v${VERSION}" \
              --notes "See the assets to download and install this version." \
              --draft
          fi
          gh release upload "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
